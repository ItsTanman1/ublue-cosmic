---
name: ublue-cosmic
description: This is my personal OS image.

#Base Image
base-image: ghcr.io/ublue-os/base-main
image-version: latest

#Module Configuration, Executed in Order
modules:
  - type: dnf
    #Install Packages
    repos:
      cleanup: true
      copr:
        - ryanabx/cosmic-epoch
        - bieszczaders/kernel-cachyos-addons
    install:
      install-weak-deps: false
      packages:
        #COSMIC Packages
        - cosmic-app-library
        - cosmic-applets
        - cosmic-bg
        - cosmic-comp
        - cosmic-edit
        - cosmic-files
        - cosmic-greeter
        - cosmic-icon-theme
        - cosmic-idle
        - cosmic-initial-setup
        - cosmic-launcher
        - cosmic-monitor
        - cosmic-notifications
        - cosmic-osd
        - cosmic-osk
        - cosmic-panel
        - cosmic-player
        - cosmic-randr
        - cosmic-screenshot
        - cosmic-session
        - cosmic-settings
        - cosmic-settings-daemon
        - cosmic-store
        - cosmic-term
        - cosmic-viewer
        - cosmic-wallpapers
        - cosmic-workspaces
        - xdg-desktop-portal-cosmic
        - pop-launcher

        #Additional Packages
        - fastfetch
        - fish
        - scx-scheds
        - scx-tools
    
    #Remove Packages
    remove:
      packages:
        - firefox-langpacks
        - firefox
        - htop
        - nvtop

  #This sets up the proper policy & signing files for signed images to work fully
  - type: signing
