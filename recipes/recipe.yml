---
name: ublue-cosmic
description: This is my personal OS image.

#Base Image
base-image: ghcr.io/ublue-os/base-main
image-version: latest

#Module Configuration, Executed in Order
modules:
  - type: dnf
    #Install Packages
    group-install:
      with-optional: false
      install-weak-deps: false
      packages:
        - cosmic-desktop
      exclude:
        - system-config-printer
        - gnome-keyring-pam
    repos:
      cleanup: true
      copr:
        - bieszczaders/kernel-cachyos-addons
    install:
      packages:
        - cosmic-monitor
        - fastfetch
        - fish
        - scx-tools
        - scx-scheds
    
    #Remove Packages
    remove:
      packages:
        - firefox-langpacks
        - firefox
        - htop
        - nvtop

  #This sets up the proper policy & signing files for signed images to work fully
  - type: signing
